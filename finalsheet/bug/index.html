<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinalSheet Scorebug</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Transparent live-stream overlay. Add as a Web / Browser source (PRISM, OBS) at 1280x720 or 1920x1080. */
:root{--p:#e0b84c;--a:#6b1bbb;--o:#c8102e;--ot:#fff}
*{box-sizing:border-box;margin:0}
html,body{background:transparent!important;overflow:hidden;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;font-family:Inter,sans-serif}
.bug{position:absolute;left:36px;top:30px;display:flex;height:52px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45));
 transform:translateY(-140%);opacity:0;transition:transform .6s cubic-bezier(.2,1.3,.4,1),opacity .4s}
.bug.on{transform:none;opacity:1}
.team{display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;color:#fff;font:900 22px Inter;letter-spacing:.04em;white-space:nowrap}
.home{background:var(--a);background-image:linear-gradient(180deg,rgba(255,255,255,.14),transparent);border-radius:10px 0 0 10px;border-left:6px solid var(--p)}
.away{background:var(--o);background-image:linear-gradient(180deg,rgba(255,255,255,.14),transparent);color:var(--ot);padding:0 8px 0 14px}
.crest{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:900 13px Inter;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);overflow:hidden}
.crest img{width:100%;height:100%;object-fit:cover}
.home .crest{background:var(--p);color:var(--a)}.away .crest{background:var(--ot);color:var(--o)}
.score{background:#0c0c10;color:#fff;font:400 34px Anton;display:flex;align-items:center;gap:14px;padding:0 16px}
.score i{width:2px;height:22px;background:rgba(255,255,255,.2)}
.score b{font-weight:400;display:inline-block}
.score b.bump{animation:bump .9s}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.6);color:var(--p)}100%{transform:scale(1)}}
.clock{background:var(--p);color:#16101f;font:900 22px Inter;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:0 10px 10px 0;font-variant-numeric:tabular-nums;min-width:132px}
.clock small{font:800 12px Inter;opacity:.7;letter-spacing:.08em}
.dot{width:8px;height:8px;border-radius:50%;background:#e11;animation:pulse 1.4s infinite}
.paused .dot{animation:none;background:#16101f55}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(238,17,17,.25)}}
/* goal */
.goal{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:center;pointer-events:none}
.gcard{display:flex;height:110px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.55));transform:translateY(160%);transition:transform .55s cubic-bezier(.2,1.25,.4,1)}
.goal.on .gcard{transform:none}
.gword{background:var(--gp);color:var(--ga);font:400 78px Anton;padding:0 40px 0 28px;display:flex;align-items:center;clip-path:polygon(0 0,100% 0,92% 100%,0 100%);border-radius:12px 0 0 12px}
.gwho{background:var(--ga);background-image:linear-gradient(120deg,rgba(255,255,255,.12),transparent 60%,rgba(0,0,0,.35));color:#fff;padding:0 34px 0 40px;display:flex;align-items:center;margin-left:-22px;clip-path:polygon(5% 0,100% 0,100% 100%,0 100%);border-radius:0 12px 12px 0}
.num{font:400 64px Anton;color:var(--gp);margin-right:18px;line-height:1}
.gwho b{font:900 34px Inter;letter-spacing:.03em;display:block}.gwho span{font:700 16px Inter;opacity:.8;letter-spacing:.14em}
/* side pop-ups */
.toasts{position:absolute;right:36px;bottom:60px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.toast{display:flex;height:64px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5));transform:translateX(130%);transition:transform .5s cubic-bezier(.2,1.2,.4,1)}
.toast.on{transform:none}
.tk{width:38px;border-radius:10px 0 0 10px;display:grid;place-items:center;font:900 20px Inter;color:#16101f}
.tk i{width:16px;height:22px;border-radius:3px;border:2px solid rgba(0,0,0,.35)}
.tb{background:#0c0c10;color:#fff;padding:0 22px;display:flex;flex-direction:column;justify-content:center;border-radius:0 10px 10px 0}
.tb b{font:900 22px Inter;white-space:nowrap}.tb span{font:700 12px Inter;letter-spacing:.14em;opacity:.65}
.in{color:#3ddc84}.out{color:#ff5a5a}
/* big card */
.big{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,4,20,.6);opacity:0;transition:opacity .6s}
.big.on{opacity:1}
.bc{text-align:center;color:#fff}
.bc .k{display:inline-block;background:var(--p);color:var(--a);font:900 18px Inter;letter-spacing:.3em;padding:8px 18px;border-radius:6px}
.row{display:flex;align-items:center;justify-content:center;gap:40px;margin:18px 0 10px}
.row .crest{width:110px;height:110px;font-size:34px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.4)}
.row .s{font:400 140px Anton;line-height:1}
.names{font:800 18px Inter;letter-spacing:.06em}
.scorers{font:700 16px Inter;opacity:.8;margin-top:6px}
.mark{position:absolute;left:42px;top:90px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);color:#fff;font:800 12px Inter;letter-spacing:.14em;padding:4px 10px 4px 4px;border-radius:0 0 8px 8px;opacity:0;transition:opacity .6s .3s}
.mark img{width:20px;height:20px;border-radius:5px}
.bug.on~.mark,.big.on~.mark{opacity:1}
.note{position:absolute;left:36px;bottom:20px;font:800 12px Inter;color:#fff;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:6px;letter-spacing:.1em;display:none}
</style></head>
<body><div id="stage">
 <div class="bug" id="bug">
  <div class="team home"><div class="crest" id="hc"></div><span id="hn"></span></div>
  <div class="score"><b id="hs">0</b><i></i><b id="as">0</b></div>
  <div class="team away"><span id="an"></span><div class="crest" id="ac"></div></div>
  <div class="clock" id="clk"><span class="dot"></span><span id="ct">0:00</span><small id="per">1H</small></div>
 </div>
 <div class="goal" id="goal"><div class="gcard"><div class="gword">GOAL!</div><div class="gwho"><div class="num" id="gnum"></div><div><b id="gname"></b><span id="gsub"></span></div></div></div></div>
 <div class="toasts" id="toasts"></div>
 <div class="big" id="big"><div class="bc"><span class="k" id="bk">HALF TIME</span>
  <div class="row"><div class="crest" id="bhc" style="background:var(--p);color:var(--a)"></div><div class="s" id="bs">0 – 0</div><div class="crest" id="bac" style="background:var(--ot);color:var(--o)"></div></div>
  <div class="names" id="bn"></div><div class="scorers" id="bsc"></div></div></div>
 <div class="mark"><img src="https://moxieappdesign.com/finalsheet/media/icon-180.png" alt="">FINALSHEET</div>
 <div class="note" id="note"></div>
</div>
<script>
(function(){
var Q=new URLSearchParams(location.search), $=function(i){return document.getElementById(i)};
var stage=$('stage');
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720)||1;stage.style.transform='scale('+s+')';
 stage.style.left=((innerWidth-1280*s)/2)+'px';stage.style.top=((innerHeight-720*s)/2)+'px'}
addEventListener('resize',fit);fit();
function hex(c,d){return /^#?[0-9a-f]{3,8}$/i.test(c||'')?(c[0]=='#'?c:'#'+c):d}
function lum(h){h=h.replace('#','');if(h.length==3)h=h.split('').map(function(x){return x+x}).join('');
 var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)/255}
function abbr(n){n=(n||'').trim();var w=n.split(/\s+/).filter(function(x){return !/^(fc|sc|the|u\d+)$/i.test(x)});
 if(w.length>1)return (w[0][0]+w[1][0]+(w[2]?w[2][0]:'')).toUpperCase();return (w[0]||n).slice(0,3).toUpperCase()}
function crest(el,name,logo,ab){el.innerHTML='';if(logo){var i=new Image();i.src=logo;i.onerror=function(){el.textContent=(ab||abbr(name)).slice(0,2)};el.appendChild(i)}else el.textContent=(ab||abbr(name)).slice(0,2)}
function mmss(ms){ms=Math.max(0,ms);var m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return m+':'+(s<10?'0':'')+s}
function setColors(p,a,o){var r=document.documentElement.style;r.setProperty('--p',p);r.setProperty('--a',a);r.setProperty('--o',o);
 r.setProperty('--ot',lum(o)>0.7?'#111':'#fff')}

// ---- render a view model ----
// V = {home:{name,abbr,logo,score}, away:{...}, clock:{baseMs,runAt|null,dir:'up'|'down',lenMs}, period:'1H', status:'live'|'ht'|'ft'|'setup',
//      events:[{id,kind:'goal'|'card'|'sub',side:'home'|'away',min,num,name,assist,color,inNum,inName}] , scorers:'...' }
var shown={},first=true,last=null,timer=null;
function render(V){
 last=V;
 $('hn').textContent=V.home.abbr||abbr(V.home.name);$('an').textContent=V.away.abbr||abbr(V.away.name);
 crest($('hc'),V.home.name,V.home.logo,V.home.abbr);crest($('ac'),V.away.name,V.away.logo,V.away.abbr);
 bumpSet('hs',V.home.score);bumpSet('as',V.away.score);
 $('per').textContent=V.period||'';
 $('bug').classList.toggle('on',V.status!=='setup');
 var big=V.status==='ht'||V.status==='ft';
 if(big){$('bk').textContent=V.status==='ft'?'FULL TIME':'HALF TIME';$('bs').textContent=V.home.score+' – '+V.away.score;
  crest($('bhc'),V.home.name,V.home.logo,V.home.abbr);crest($('bac'),V.away.name,V.away.logo,V.away.abbr);
  $('bn').textContent=(V.home.name+'  ·  '+V.away.name).toUpperCase();$('bsc').textContent=V.scorers||''}
 $('big').classList.toggle('on',big);
 (V.events||[]).forEach(function(e){if(shown[e.id])return;shown[e.id]=1;if(!first)pop(e)});
 first=false;tick();
}
function bumpSet(id,v){var el=$(id);if(el.textContent!==String(v)){el.textContent=v;if(!first){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}}}
function tick(){if(!last)return;var c=last.clock||{},run=c.runAt!=null,el=c.baseMs+(run?Date.now()-c.runAt:0);
 $('ct').textContent=mmss(c.dir==='down'?c.lenMs-el:el);$('clk').classList.toggle('paused',!run)}
setInterval(tick,250);
var q=[],busy=false;
function pop(e){q.push(e);if(!busy)next()}
function next(){var e=q.shift();if(!e){busy=false;return}busy=true;
 if(e.kind==='goal'){var r=document.documentElement.style,side=e.side==='away';
  r.setProperty('--gp',side?'#fff':'var(--p)');r.setProperty('--ga',side?'var(--o)':'var(--a)');
  $('gnum').textContent=e.num!=null?e.num:'';$('gname').textContent=(e.name||(side?'':'')).toUpperCase()||(side?last.away.name.toUpperCase():'GOAL');
  $('gsub').textContent=[e.min!=null?e.min+"'":'',e.assist?'ASSIST '+e.assist.toUpperCase():''].filter(Boolean).join(' · ');
  $('goal').classList.add('on');setTimeout(function(){$('goal').classList.remove('on');setTimeout(next,600)},8000);return}
 var t=document.createElement('div');t.className='toast';
 var who=function(n,m){return (n!=null?'#'+n+' ':'')+(m||'').toUpperCase()};
 if(e.kind==='card'){t.innerHTML='<div class="tk" style="background:'+(e.color==='red'?'#e1251b':'#ffd400')+'"><i style="background:'+(e.color==='red'?'#e1251b':'#ffd400')+'"></i></div><div class="tb"><span>'+(e.color==='red'?'RED CARD':'YELLOW CARD')+(e.min!=null?' · '+e.min+"'":'')+'</span><b></b></div>';
  t.querySelector('b').textContent=who(e.num,e.name)||(e.side==='away'?last.away.name:last.home.name)}
 else{t.innerHTML='<div class="tk" style="background:var(--p)">⇄</div><div class="tb"><span>SUBSTITUTION'+(e.min!=null?' · '+e.min+"'":'')+'</span><b><span class="in">▲</span> <em class="i"></em>&nbsp; <span class="out">▼</span> <em class="o"></em></b></div>';
  t.querySelector('.i').textContent=who(e.inNum,e.inName);t.querySelector('.o').textContent=who(e.num,e.name);t.querySelectorAll('em').forEach(function(x){x.style.fontStyle='normal'})}
 $('toasts').appendChild(t);requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.add('on')})});
 setTimeout(function(){t.classList.remove('on');setTimeout(function(){t.remove()},600)},7000);
 setTimeout(next,1200);
}
window.FSBug={render:render};

// ---- demo mode: fake game that moves on its own (no account, no database) ----
if(Q.has('demo')||!Q.has('t')){
 setColors(hex(Q.get('p'),'#e0b84c'),hex(Q.get('a'),'#6b1bbb'),hex(Q.get('o'),'#c8102e'));
 var hide=Q.get('names')==='off';
 var V={home:{name:Q.get('home')||'FinalSheet Team U16',abbr:Q.get('ha')||'FST',score:0},away:{name:Q.get('away')||'Rivals FC',abbr:'RIV',score:0},
  clock:{baseMs:66*60000+40000,runAt:Date.now(),dir:'up'},period:'2H',status:'live',events:[]};
 var n=0,P=function(num,name){return hide?{num:num,name:''}:{num:num,name:name}};
 var script=[
  function(){V.home.score++;V.events.push(Object.assign({id:'g'+n,kind:'goal',side:'home',min:67,assist:hide?'#7':'#7 Lee'},P(9,'Martinez')))},
  function(){V.events.push(Object.assign({id:'c'+n,kind:'card',side:'away',min:69,color:'yellow'},P(4,'Okafor')))},
  function(){var p=P(9,'Martinez'),q=P(14,'Brooks');V.events.push({id:'s'+n,kind:'sub',side:'home',min:70,num:p.num,name:p.name,inNum:q.num,inName:q.name})},
  function(){V.away.score++;V.events.push(Object.assign({id:'g'+n,kind:'goal',side:'away',min:72},P(11,'')))},
  function(){V.clock={baseMs:V.clock.baseMs+(Date.now()-V.clock.runAt),runAt:null,dir:'up'};V.status='ft';V.scorers=hide?'':'Martinez 23\', 67\'  ·  Lee 55\''},
  function(){V.status='live';V.home.score=0;V.away.score=0;V.events=[];shown={};V.clock={baseMs:66*60000+40000,runAt:Date.now(),dir:'up'}}
 ];
 render(V);
 setInterval(function(){script[n%script.length]();n++;render(V)},+(Q.get('every')||12)*1000);
 if(Q.has('label')){$('note').style.display='block';$('note').textContent='FINALSHEET SCOREBUG · DEMO'}
}
})();
</script></body></html>
